[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentroots"
version = "0.2.0"
description = "Shared, evidence-backed project knowledge across AI agents and sessions"
authors = [{name = "Shanmukha Vellamcheti"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["ai-agents", "mcp", "provenance", "agent-memory", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastembed>=0.7,<1",
  "mcp>=1.29,<2",
  "numpy>=1.26,<2.4",
  "pydantic>=2.7,<3",
  "platformdirs>=4,<5",
  "rapidfuzz>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/shanmukha-here/agentroots"
Repository = "https://github.com/shanmukha-here/agentroots"
Issues = "https://github.com/shanmukha-here/agentroots/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23,<5",
  "mypy>=1.11",
  "numpy>=1.26,<2.4",
  "pytest>=8",
  "ruff>=0.6",
]
semantic = []
hooks = ["gliner2>=1.3,<2"]
qwen = ["accelerate>=1,<2", "torch>=2.5", "transformers>=5,<6"]
benchmarks = [
  "fastembed>=0.7,<1",
  "numpy>=1.26,<2.4",
  "tiktoken>=0.7,<1",
]

[project.scripts]
agentroots = "agentroots.cli:main"
agentroots-mcp = "agentroots.server:main"
agentroots-hookd = "agentroots.hooks:daemon_main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentroots"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/agentroots" = "agentroots/codex_plugin"
"plugins/opencode/agentroots.js" = "agentroots/opencode_plugin.js"
"schemas" = "agentroots/schemas/v1"
"THIRD_PARTY_LICENSES.txt" = "agentroots/THIRD_PARTY_LICENSES.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentroots"]
