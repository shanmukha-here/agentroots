[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-state-mcp"
version = "0.1.0"
description = "Cross-harness research provenance and state protocol"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "pydantic>=2.7,<3", "platformdirs>=4,<5", "rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[project.scripts]
research-state = "research_state_mcp.cli:main"
research-state-mcp = "research_state_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_state_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_state_mcp"]
