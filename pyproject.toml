[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentroots"
version = "0.1.0"
description = "Evidence-governed continuity for AI agents"
authors = [{name = "Shanmukha Vellamcheti"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["ai-agents", "mcp", "provenance", "agent-memory", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=1.2,<2", "pydantic>=2.7,<3", "platformdirs>=4,<5", "rapidfuzz>=3.9,<4"]

[project.urls]
Homepage = "https://github.com/shanmukha-here/agentroots"
Repository = "https://github.com/shanmukha-here/agentroots"
Issues = "https://github.com/shanmukha-here/agentroots/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8", "ruff>=0.6"]
demo = ["Pillow>=10,<12", "imageio-ffmpeg>=0.5,<1"]

[project.scripts]
agentroots = "agentroots.cli:main"
agentroots-mcp = "agentroots.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentroots"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentroots"]
