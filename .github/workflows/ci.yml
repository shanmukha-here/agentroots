name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Cross-harness continuity contract
        run: |
          python -m pytest -q \
            tests/test_backfill.py::test_cross_harness_content_is_deduplicated_with_alias \
            tests/test_backfill.py::test_backfilled_history_is_recalled_by_fresh_live_hook
      - name: Lint
        run: python -m ruff check src tests benchmarks
      - name: Type check
        run: python -m mypy src --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check plugin syntax
        run: |
          node --check plugins/agentroots/scripts/hook.mjs
          node --check plugins/opencode/agentroots.js
      - name: Build graph viewer
        run: |
          npm ci --prefix frontend --ignore-scripts
          npm run build --prefix frontend
      - name: Verify packaged graph assets are current
        run: git diff --exit-code -- src/agentroots/assets

  package-smoke:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install dist/*.whl
          .smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('fastembed') is not None; assert importlib.util.find_spec('numpy') is not None"
          .smoke/bin/agentroots --help
          .smoke/bin/python - <<'PY'
          import json
          from importlib.resources import files

          package = files("agentroots")
          assert package.joinpath("assets", "graph-viewer.js").is_file()
          assert package.joinpath("codex_plugin", "hooks", "hooks.json").is_file()
          assert package.joinpath("opencode_plugin.js").is_file()
          schemas = package.joinpath("schemas").joinpath("v1")
          expected = {
              "event.schema.json",
              "evidence.schema.json",
              "link.schema.json",
              "packet.schema.json",
              "record.schema.json",
          }
          assert {item.name for item in schemas.iterdir()} == expected
          for name in expected:
              schema = json.loads(schemas.joinpath(name).read_text(encoding="utf-8"))
              assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          PY
      - name: Smoke packaged Codex hook with installed CLI
        env:
          AGENTROOTS_DB: ${{ runner.temp }}/agentroots-wheel-hook.sqlite3
          AGENTROOTS_HOOK_RUNTIME: ${{ runner.temp }}/agentroots-wheel-hooks
          AGENTROOTS_HOOK_PORT: "37891"
          AGENTROOTS_PROJECT: ci-wheel
          AGENTROOTS_SEMANTIC: "off"
        run: |
          HOOK=$(.smoke/bin/python -c "from importlib.resources import files; print(files('agentroots').joinpath('codex_plugin', 'scripts', 'hook.mjs'))")
          node --check "$HOOK"
          export PATH="$PWD/.smoke/bin:$PATH"
          printf '%s' '{"hook_event_name":"UserPromptSubmit","event_id":"ci-hook","session_id":"ci-session","cwd":"/tmp/ci-wheel","prompt":"continue the project"}' | node "$HOOK" UserPromptSubmit > "${{ runner.temp }}/agentroots-hook-output.json"
          .smoke/bin/python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          output = json.loads(
              Path(os.environ["RUNNER_TEMP"], "agentroots-hook-output.json").read_text()
          )
          assert isinstance(output, dict)
          with sqlite3.connect(os.environ["AGENTROOTS_DB"]) as connection:
              assert connection.execute(
                  "SELECT count(*) FROM hook_events WHERE event_id='ci-hook'"
              ).fetchone()[0] == 1
          PY
      - name: Smoke real MCP stdio transport from installed wheel
        env:
          AGENTROOTS_DB: /tmp/agentroots-wheel-smoke.sqlite3
          AGENTROOTS_SEMANTIC: "off"
        run: |
          .smoke/bin/python - <<'PY'
          import asyncio

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client


          async def main() -> None:
              server = StdioServerParameters(command=".smoke/bin/agentroots-mcp")
              async with stdio_client(server) as streams:
                  async with ClientSession(*streams) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      assert any(tool.name == "research_query" for tool in tools.tools)
                      result = await session.call_tool(
                          "research_query", {"project": "ci-smoke", "query": ""}
                      )
                      assert not result.isError


          asyncio.run(main())
          PY
